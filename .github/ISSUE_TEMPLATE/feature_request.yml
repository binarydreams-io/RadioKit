name: Feature request
description: Propose a focused addition or behavior change.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the application problem that the feature must solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the public behavior and include a short Swift example.
    validations:
      required: true
  - type: textarea
    id: platform-impact
    attributes:
      label: Platform and audio impact
      description: Describe differences for iOS, macOS, audio routes, background playback, or remote commands.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe the approaches that you considered and why they do not solve the problem.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: The proposal supports the iOS 17 and macOS 14 deployment baselines.
          required: true
        - label: The proposal does not require RadioKit to own a station catalog or application UI.
          required: true
