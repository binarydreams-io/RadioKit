name: Bug report
description: Report incorrect or unexpected RadioKit behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Issue content is public. Remove credentials, signed URLs, private station
        addresses, tokens, and personal data before you submit the report.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the exact steps and the smallest Swift example that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RadioKit version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift version
      description: Paste the first line from `swift --version`.
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version
      description: Paste the output from `xcodebuild -version`.
      placeholder: Xcode 26.0 (17A000)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - macOS
    validations:
      required: true
  - type: input
    id: device-os
    attributes:
      label: Device and OS
      description: Include the device model and exact OS version.
      placeholder: iPhone 17 Pro, iOS 26.0
    validations:
      required: true
  - type: input
    id: stream-url
    attributes:
      label: Stream URL
      description: Use a public test URL. Do not include credentials, tokens, or signed query values.
      placeholder: https://radio.example/live
  - type: input
    id: codec
    attributes:
      label: Stream codec and container
      description: Include the reported codec, container, and bitrate when known.
      placeholder: AAC in ADTS, 128 kbit/s
  - type: dropdown
    id: audio-route
    attributes:
      label: Audio route
      options:
        - Built-in speaker
        - Receiver
        - Wired output
        - Bluetooth
        - AirPlay
        - CarPlay
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Add relevant output after you remove credentials, private URLs, tokens, and personal data.
      render: shell
  - type: checkboxes
    id: credential-check
    attributes:
      label: Public-data check
      options:
        - label: I removed credentials, tokens, signed URLs, private station addresses, and personal data.
          required: true
