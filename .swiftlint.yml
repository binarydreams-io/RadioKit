# SwiftLint configuration for RadioKit release sources.

included:
  - Sources/RadioKit
  - Tests/RadioKitTests
  - CompileFixtures/Consumer/Sources
  - Examples/RadioPlayer/RadioPlayer

excluded:
  - .build
  - .swiftpm
  - DerivedData
  - Examples/RadioPlayer/DerivedData

disabled_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - identifier_name
  - inclusive_language
  - nesting
  - opening_brace
  - prefer_self_in_static_references
  - trailing_comma
  - type_body_length

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - shorthand_optional_binding
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 140
  error: 160
  ignores_urls: true
  ignores_comments: true

function_parameter_count:
  warning: 8
  error: 12

large_tuple:
  warning: 6
  error: 12

type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID
